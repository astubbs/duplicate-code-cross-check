name: 'Duplicate Code Cross-Check'
description: 'Detect duplicate code using PMD CPD + jscpd with base-vs-PR comparison'
author: 'Antony Stubbs'
branding:
  icon: copy
  color: purple

inputs:
  github-token:
    description: 'GitHub token for posting PR comments and review annotations'
    required: true
  directories:
    description: 'Space-separated list of directories to scan'
    required: true
  file-extensions:
    description: 'Comma-separated file extensions for percentage calculation (or "auto" to detect from files)'
    required: false
    default: 'auto'
  cpd-language:
    description: 'PMD CPD language - java, python, kotlin, cpp, csharp, go, javascript, typescript, ruby, scala, etc. (or "auto" to detect from files)'
    required: false
    default: 'auto'
  cpd-min-tokens:
    description: 'PMD CPD minimum token count to flag as a clone'
    required: false
    default: '70'
  cpd-max-duplication:
    description: 'PMD CPD fails if total duplication exceeds this percentage'
    required: false
    default: '5'
  cpd-max-increase:
    description: 'PMD CPD fails if duplication increases vs base branch by more than this percentage'
    required: false
    default: '0.1'
  jscpd-file-pattern:
    description: 'jscpd glob pattern for files to scan (or "auto" to detect from files)'
    required: false
    default: 'auto'
  jscpd-ignore-pattern:
    description: 'jscpd comma-separated glob patterns to ignore'
    required: false
    default: '**/target/**,**/node_modules/**,**/build/**,**/dist/**,**/__pycache__/**,**/vendor/**,**/.venv/**,**/.next/**,**/.output/**,**/.nuxt/**,**/*.egg-info/**,**/out/**,**/.git/**'
  jscpd-min-lines:
    description: 'jscpd minimum line count to flag as a clone'
    required: false
    default: '6'
  jscpd-min-tokens:
    description: 'jscpd minimum token count to flag as a clone'
    required: false
    default: '70'
  jscpd-max-duplication:
    description: 'jscpd fails if total duplication exceeds this percentage'
    required: false
    default: '4'
  jscpd-max-increase:
    description: 'jscpd fails if duplication increases vs base branch by more than this percentage'
    required: false
    default: '0.1'
  pmd-version:
    description: 'PMD version to install'
    required: false
    default: '7.9.0'

runs:
  using: 'composite'
  steps:
    - name: Setup Java (for PMD CPD)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js (for jscpd and report script)
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    # THE ACTION MUST NOT INSTALL ANYTHING INTO THE TREE IT IS ABOUT TO MEASURE. A composite `run`
    # step's working directory is $GITHUB_WORKSPACE, so this used to unzip a 79MB PMD distribution -
    # 106 jars, plus the 80MB source zip - into the scanned directory. With `directories: '.'` the
    # consequences were not cosmetic:
    #   * auto-detection reported `jar` and `zip` as source extensions of the repository, and
    #     `0/bin/pmd` / `0/LICENSE` from `pmd-bin-7.9.0/` cut after the patch number;
    #   * `report.js` counts newline BYTES in every file matching that extension list, so PMD's own
    #     jars inflated the line-count denominator 4.01x on parallel-consumer (793,019 vs 197,832).
    #     Every CPD duplication percentage was therefore reported roughly four times too small, and
    #     a `cpd-max-duplication` threshold calibrated against that reading is four times too loose.
    # $RUNNER_TEMP is outside the workspace, is cleaned up by the runner, and is already on the same
    # filesystem, so nothing else has to change.
    - name: Install PMD
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        wget -q "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${{ inputs.pmd-version }}/pmd-dist-${{ inputs.pmd-version }}-bin.zip"
        unzip -q "pmd-dist-${{ inputs.pmd-version }}-bin.zip"
        rm -f "pmd-dist-${{ inputs.pmd-version }}-bin.zip"
        echo "$RUNNER_TEMP/pmd-bin-${{ inputs.pmd-version }}/bin" >> "$GITHUB_PATH"

    # INSTALL THE JSCPD ENGINE HERE, NOT INSIDE THE STEPS THAT MEASURE IT.
    #
    # Both engine steps used to invoke `npx jscpd@4`. `npx` resolves the `4` range against the
    # registry and, on a cold cache, downloads 118 packages - so the entire install landed on the
    # FIRST call, which is the base-branch step, and the second call hit the npx cache. Measured on
    # one consuming repository, same base sha, same commands, two runs 3.5 hours apart:
    #
    #                       base step   PR step   jscpd's own reported analysis time
    #   healthy run            20.0s     12.3s    9.99s / 10.04s
    #   timed-out run         288.4s     15.0s    12.07s / 12.18s
    #
    # The engines' own work was the same in both (jscpd's self-timer moved 21%, not 14x), and the PR
    # step - which does identical work minus the install - stayed at ~14s. The 276s of silence at the
    # front of the slow base step was one blocking network call. Locally, `npx jscpd@4` on an empty
    # npm cache takes 98s at 2% CPU; on the runner it was 7s on a good day and ~262s on a bad one,
    # and 288 + 15 + setup overruns the consuming job's 5-minute timeout - which GitHub then renders
    # as "cancelled" rather than as a timeout.
    #
    # Installing once, before either measured step, makes the two steps symmetric AND makes the cost
    # legible: a slow install is now a slow step with its own name and duration, not 4m36s of silence
    # attributed to duplicate detection. The lockfile pins exact versions, so this resolves nothing
    # at run time; `npx` re-resolved a range on every invocation.
    - name: Install jscpd engine and report dependencies
      shell: bash
      env:
        # npm's default fetch-timeout is 300000ms. A single stalled registry request can therefore
        # consume a whole five-minute job budget before npm even considers a retry, which is the
        # failure actually observed. Fail fast and retry instead.
        npm_config_fetch_timeout: '30000'
        npm_config_fetch_retries: '3'
        npm_config_fetch_retry_maxtimeout: '20000'
      run: |
        set -euo pipefail
        # Installed into $RUNNER_TEMP for the same reason PMD is: with `uses: ./` (the self-test, and
        # anyone vendoring this action) $GITHUB_ACTION_PATH *is* the scanned workspace, and 118
        # packages of node_modules must not appear in it.
        TOOLS="$RUNNER_TEMP/duplicate-code-cross-check-tools"
        mkdir -p "$TOOLS"
        cp "$GITHUB_ACTION_PATH/package.json" "$GITHUB_ACTION_PATH/package-lock.json" "$TOOLS/"
        started=$SECONDS
        ( cd "$TOOLS" && npm ci --omit=dev --no-audit --no-fund )
        echo "Engine and report dependencies installed in $(( SECONDS - started ))s"
        echo "DUPCHECK_TOOLS=$TOOLS" >> "$GITHUB_ENV"
        echo "JSCPD=$TOOLS/node_modules/.bin/jscpd" >> "$GITHUB_ENV"

    - name: Auto-detect language from source files
      id: detect
      shell: bash
      run: |
        # Map file extensions to PMD CPD language identifiers.
        # Multiple extensions can map to the same language; counts are aggregated.
        ext_to_cpd_lang() {
          case "$1" in
            java)                  echo "java" ;;
            js|jsx|mjs|cjs)        echo "javascript" ;;
            ts|tsx|mts|cts)        echo "typescript" ;;
            py|pyw)                echo "python" ;;
            kt|kts)                echo "kotlin" ;;
            cpp|cc|cxx|hpp|h|c)    echo "cpp" ;;
            cs)                    echo "csharp" ;;
            go)                    echo "go" ;;
            rb)                    echo "ruby" ;;
            scala|sc)              echo "scala" ;;
            swift)                 echo "swift" ;;
            lua)                   echo "lua" ;;
            m)                     echo "objectivec" ;;
            groovy|gvy)            echo "groovy" ;;
            xml|xsl|xslt|wsdl)    echo "xml" ;;
            pl|pm)                 echo "perl" ;;
            php)                   echo "php" ;;
            rs)                    echo "rust" ;;
            *)                     echo "" ;;
          esac
        }

        DIRS="${{ inputs.directories }}"
        INPUT_CPD_LANG="${{ inputs.cpd-language }}"
        INPUT_JSCPD_PATTERN="${{ inputs.jscpd-file-pattern }}"
        INPUT_FILE_EXT="${{ inputs.file-extensions }}"

        NEED_SCAN="false"
        if [[ "$INPUT_CPD_LANG" == "auto" ]] || [[ "$INPUT_JSCPD_PATTERN" == "auto" ]] || [[ "$INPUT_FILE_EXT" == "auto" ]]; then
          NEED_SCAN="true"
        fi

        if [[ "$NEED_SCAN" == "true" ]]; then
          echo "::group::Auto-detecting language from files in: $DIRS"

          # Count files by extension, excluding common non-source directories.
          # bin/detect-extensions.sh owns what counts as an extension and why; its header carries
          # the malformed output this replaced, and bin/detect-extensions.test.js pins each case.
          declare -A LANG_COUNTS
          ALL_EXTENSIONS=()

          while IFS= read -r line; do
            count=$(echo "$line" | awk '{print $1}')
            ext=$(echo "$line" | awk '{print $2}')
            if [[ -n "$ext" ]]; then
              ALL_EXTENSIONS+=("$ext")
              lang=$(ext_to_cpd_lang "$ext")
              if [[ -n "$lang" ]]; then
                LANG_COUNTS[$lang]=$(( ${LANG_COUNTS[$lang]:-0} + count ))
              fi
            fi
          done < <(bash "$GITHUB_ACTION_PATH/bin/detect-extensions.sh" $DIRS)

          # Pick dominant CPD language (highest count, alphabetical tiebreak)
          BEST_LANG=""
          BEST_COUNT=0
          for lang in $(echo "${!LANG_COUNTS[@]}" | tr ' ' '\n' | sort); do
            count=${LANG_COUNTS[$lang]}
            if (( count > BEST_COUNT )); then
              BEST_COUNT=$count
              BEST_LANG=$lang
            fi
          done

          # Build jscpd glob from all detected extensions
          if [[ ${#ALL_EXTENSIONS[@]} -eq 1 ]]; then
            DETECTED_JSCPD_PATTERN="**/*.${ALL_EXTENSIONS[0]}"
          elif [[ ${#ALL_EXTENSIONS[@]} -gt 1 ]]; then
            EXT_LIST=$(IFS=,; echo "${ALL_EXTENSIONS[*]}")
            DETECTED_JSCPD_PATTERN="**/*.{${EXT_LIST}}"
          else
            DETECTED_JSCPD_PATTERN=""
          fi

          # Build file-extensions list
          DETECTED_FILE_EXT=$(IFS=,; echo "${ALL_EXTENSIONS[*]}")

          echo "Detected extensions: ${ALL_EXTENSIONS[*]}"
          echo "Detected CPD language: ${BEST_LANG:-<none>} (${BEST_COUNT} files)"
          echo "Detected jscpd pattern: ${DETECTED_JSCPD_PATTERN}"
          echo "Detected file-extensions: ${DETECTED_FILE_EXT}"

          if [[ -z "$BEST_LANG" ]]; then
            echo "::warning::No PMD CPD-supported language detected in scanned directories. CPD will be skipped."
          fi

          echo "::endgroup::"
        fi

        # Resolve each input: use detected value if 'auto', otherwise use explicit value
        if [[ "$INPUT_CPD_LANG" == "auto" ]]; then
          echo "RESOLVED_CPD_LANGUAGE=${BEST_LANG:-}" >> $GITHUB_ENV
        else
          echo "RESOLVED_CPD_LANGUAGE=${INPUT_CPD_LANG}" >> $GITHUB_ENV
        fi

        if [[ "$INPUT_JSCPD_PATTERN" == "auto" ]]; then
          echo "RESOLVED_JSCPD_PATTERN=${DETECTED_JSCPD_PATTERN:-}" >> $GITHUB_ENV
        else
          echo "RESOLVED_JSCPD_PATTERN=${INPUT_JSCPD_PATTERN}" >> $GITHUB_ENV
        fi

        if [[ "$INPUT_FILE_EXT" == "auto" ]]; then
          echo "RESOLVED_FILE_EXTENSIONS=${DETECTED_FILE_EXT:-}" >> $GITHUB_ENV
        else
          echo "RESOLVED_FILE_EXTENSIONS=${INPUT_FILE_EXT}" >> $GITHUB_ENV
        fi

        # Both engines write their reports INTO the scanned workspace, so whichever runs second
        # would otherwise tokenise the first one's output - `cpd-base.xml` is 148KB of XML that the
        # base-branch run never sees. Appended to whatever the user asked to ignore, once, here,
        # because both engine steps need the identical value.
        OWN_OUTPUT_IGNORE='**/jscpd-base/**,**/jscpd-report/**,cpd-base.xml,cpd-pr.xml'
        USER_IGNORE="${{ inputs.jscpd-ignore-pattern }}"
        if [[ -n "$USER_IGNORE" ]]; then
          echo "RESOLVED_JSCPD_IGNORE=${USER_IGNORE},${OWN_OUTPUT_IGNORE}" >> $GITHUB_ENV
        else
          echo "RESOLVED_JSCPD_IGNORE=${OWN_OUTPUT_IGNORE}" >> $GITHUB_ENV
        fi

    # THE TWO ENGINE STEPS MUST COST THE SAME. They analyse near-identical trees with identical
    # commands, so any durable difference between them is something other than duplicate detection -
    # and whatever it is lands on the base step, where it reads as "analysing the base branch is
    # inherently slow". Both now invoke the same pre-installed binaries and differ only in which
    # commit is checked out and which reporters are asked for. If they diverge again, that is the
    # bug, not a property of the base branch.
    #
    # `RESOLVED_JSCPD_IGNORE` is the user's ignore list plus the action's own outputs; the detect
    # step above says why. Without it the PR-branch run tokenises files the base-branch run never
    # saw, which is duplication counted on one side of the comparison only.
    - name: Run both engines on base branch
      shell: bash
      run: |
        git checkout ${{ github.event.pull_request.base.sha }} --quiet 2>/dev/null || true
        if [[ -n "$RESOLVED_CPD_LANGUAGE" ]]; then
          pmd cpd --dir ${{ inputs.directories }} --language "$RESOLVED_CPD_LANGUAGE" --minimum-tokens ${{ inputs.cpd-min-tokens }} --format xml > cpd-base.xml 2>/dev/null || true
        else
          echo "Skipping CPD on base branch (no supported language detected)"
        fi
        "$JSCPD" --pattern "$RESOLVED_JSCPD_PATTERN" --ignore "$RESOLVED_JSCPD_IGNORE" --reporters json --output jscpd-base --min-lines ${{ inputs.jscpd-min-lines }} --min-tokens ${{ inputs.jscpd-min-tokens }} 2>/dev/null || true
        git checkout ${{ github.sha }} --quiet

    - name: Run both engines on PR branch
      shell: bash
      run: |
        if [[ -n "$RESOLVED_CPD_LANGUAGE" ]]; then
          pmd cpd --dir ${{ inputs.directories }} --language "$RESOLVED_CPD_LANGUAGE" --minimum-tokens ${{ inputs.cpd-min-tokens }} --format xml > cpd-pr.xml || true
        else
          echo "Skipping CPD on PR branch (no supported language detected)"
        fi
        "$JSCPD" --pattern "$RESOLVED_JSCPD_PATTERN" --ignore "$RESOLVED_JSCPD_IGNORE" --reporters consoleFull,json --output jscpd-report --min-lines ${{ inputs.jscpd-min-lines }} --min-tokens ${{ inputs.jscpd-min-tokens }} || true

    - name: Generate combined duplicate report
      uses: actions/github-script@v9
      env:
        INPUT_DIRECTORIES: ${{ inputs.directories }}
        INPUT_FILE_EXTENSIONS: ${{ env.RESOLVED_FILE_EXTENSIONS }}
        INPUT_CPD_MAX_PCT: ${{ inputs.cpd-max-duplication }}
        INPUT_CPD_MAX_INCREASE: ${{ inputs.cpd-max-increase }}
        INPUT_JSCPD_MAX_PCT: ${{ inputs.jscpd-max-duplication }}
        INPUT_JSCPD_MAX_INCREASE: ${{ inputs.jscpd-max-increase }}
        NODE_PATH: ${{ env.DUPCHECK_TOOLS }}/node_modules
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { analyzeAndReport } = require('${{ github.action_path }}/report.js');
          await analyzeAndReport({ github, context, core });
